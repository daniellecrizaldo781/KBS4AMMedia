name: Sync Cascades from Source

# Auto-syncs the authoritative Cascade & Handling source (private Google Sheet)
# into the frontend data file so CSRs always see the latest handling — no manual
# rebuild. Runs on a schedule + manual "Run workflow".
#
# SECURITY: credentials live ONLY in GitHub repo secrets
# (Settings > Secrets and variables > Actions). Nothing private is embedded in the
# frontend bundle or committed to the repo. The browser only ever receives the
# parsed, public-facing KB content — never the sheet URL, keys, or tokens.
#
# To ENABLE auto-sync (one-time):
#   1. Add repo secret  CASCADE_SYNC_MODE  = "service"   (recommended) or "csv"
#   2a. service mode -> add  GOOGLE_SERVICE_ACCOUNT_JSON  (service-account key with
#      Google Sheets API access to the sheet) and  CASCADE_SHEET_ID
#   2b. csv mode     -> add  CASCADE_SHEET_CSV_URL  (an unlisted "Publish to web"
#      CSV link from the sheet — no credentials required, but the link is shareable)
# Until CASCADE_SYNC_MODE is set, this workflow is a safe no-op.

on:
  schedule:
    - cron: '*/30 * * * *'        # every 30 minutes
  workflow_dispatch:              # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sheets client (service mode only)
        if: ${{ secrets.CASCADE_SYNC_MODE == 'service' }}
        run: pip install --quiet gspread

      - name: Sync cascades from source
        env:
          MODE: ${{ secrets.CASCADE_SYNC_MODE }}
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.CASCADE_SHEET_ID }}
          CSV_URL: ${{ secrets.CASCADE_SHEET_CSV_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, csv, io, sys

          MODE = (os.environ.get("MODE") or "").strip()
          out = "assets/js/cascades-data.js"

          if not MODE:
              # Safe no-op: leave the placeholder file untouched so the scheduled
              # run does NOT create a spurious commit every 30 minutes.
              print("No CASCADE_SYNC_MODE secret set — safe no-op (keeping placeholder unchanged).")
              sys.exit(0)

          rows = []
          if MODE == "csv":
              import urllib.request
              url = os.environ["CSV_URL"]
              data = urllib.request.urlopen(url, timeout=60).read().decode("utf-8-sig")
              rows = list(csv.DictReader(io.StringIO(data)))
          elif MODE == "service":
              import gspread
              gc = gspread.service_account_from_dict(json.loads(os.environ["SA_JSON"]))
              rows = gc.open_by_key(os.environ["SHEET_ID"]).sheet1.get_all_records()
          else:
              print("Unknown CASCADE_SYNC_MODE:", MODE); sys.exit(1)

          def get(d, *keys):
              dl = {k.lower(): v for k, v in d.items()}
              for k in keys:
                  v = dl.get(k.lower())
                  if v not in (None, ""):
                      return v
              return ""

          STATUSES = {"new", "active", "superseded", "retired"}
          cascades = []
          for r in rows:
              title = get(r, "title", "concern", "cascade", "handling")
              if not title:
                  continue
              cat = get(r, "category", "area", "type") or "General CSR Handling"
              prod = get(r, "product", "product name", "sku")
              date = get(r, "date", "updated", "effective date", "last updated")
              status = (get(r, "status") or "new").lower()
              if status not in STATUSES:
                  status = "new"
              desc = get(r, "description", "summary", "notes", "body")
              tags = [t.strip() for t in (get(r, "tags") or "").split(",") if t.strip()]
              cascades.append({
                  "id": (title + "-" + date).lower().replace(" ", "-")[:80],
                  "title": title,
                  "category": cat,
                  "product": prod,
                  "date": date,
                  "status": status,
                  "desc": (desc or "")[:240],
                  "tags": tags,
                  "relatedResources": [],
                  "relatedProducts": [],
                  "versions": [{"status": status, "label": status.upper(),
                                "date": date, "by": "", "title": title, "body": desc or ""}]
              })

          js = "// AUTO-GENERATED by .github/workflows/sync-cascades.yml — do not edit by hand.\n"
          js += "// Source: private 4AM Media Google Sheet (fetched server-side; never exposed to browser).\n"
          js += "window.KB_RAW_CASCADES = " + json.dumps(cascades, indent=2, ensure_ascii=False) + ";\n"
          open(out, "w").write(js)
          print(f"Synced {len(cascades)} cascade records.")
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "cascade auto-sync"
          git config user.email "auto-sync@users.noreply.github.com"
          if ! git diff --quiet -- assets/js/cascades-data.js; then
            git add assets/js/cascades-data.js
            git commit -m "auto-sync: update cascades from source $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "pushed"
          else
            echo "no change"
          fi
